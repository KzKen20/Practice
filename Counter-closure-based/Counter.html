<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Closure-Based Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f5f5f5;
    }
    .counter-container {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;

      padding: clamp(16px, 3.5vw, 32px) clamp(18px, 6vw, 40px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);

      width: min(92%, 560px);
      box-sizing: border-box;
      text-align: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .counter-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.12);
    }
    .counter-container h1 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #1f2937;
      font-weight: 600;
    }
    .counter-display {
      /* responsive display size */
      font-size: clamp(36px, 6vw, 72px);
      margin: clamp(12px, 2.5vw, 28px) 0;
      color: #333;
      font-variant-numeric: tabular-nums;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
      /* allow wrapping on very small screens */
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #4CAF50;
      color: white;
      min-width: 84px;
      transition: transform 120ms ease, opacity 120ms ease;
    }
    button:hover {
      background: #45a049;
    }
    #resetBtn {
      background: #f44336;
    }
    #resetBtn:hover {
      background: #d32f2f;
    }

    .counter-container .Header {
      margin: 0 0 clamp(8px, 2.2vw, 18px) 0;
      font-size: clamp(20px, 4.5vw, 40px);
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.01em;
    }


    @media (max-width: 420px) {
      .buttons {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      .buttons button {
        width: 100%;
      }
    }
    

  </style>
</head>
<body>
<div class="counter-container">

    <h1 class="Header">My Closure Counter</h1>
  <div class="counter-display" id="countDisplay">0</div>
  <div class="buttons">
    <button id="addBtn">+1</button>
    <button id="resetBtn">Reset</button>
  </div>

</div>
  

  <script src="counter.js"></script>
</body>
</html>
